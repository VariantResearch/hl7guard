[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7guard"
dynamic = ["version"]
description = "HL7Guard Free: HL7v2 message validation and de-identification for the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
hl7guard = "hl7guard.cli:main"
hl7guard-gui = "hl7guard.gui:main"

[project.urls]
Homepage = "https://hl7guard.variantresearchgroup.com"

[tool.setuptools.dynamic]
version = { attr = "hl7guard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
